name: Delta Force CN Discord Push

on:
  schedule:
    # Every 15 minutes, deliberately avoiding minute 0 to reduce scheduler congestion.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: test
        type: choice
        options:
          - test
          - normal
          - resend_latest

permissions:
  contents: write

concurrency:
  group: delta-force-cn-discord-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch official news and push to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
        run: python src/push.py --mode "$MODE"

      - name: Persist de-duplication state
        if: always()
        shell: bash
        env:
          STATE_PUSH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update notification state [skip ci]"
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${STATE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          echo "state.json push failed after 3 attempts" >&2
          exit 1
